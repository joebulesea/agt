[workspace]
resolver = "3"
members = [
    "crates/agt-proto",
    "crates/agt-core",
    "crates/agt-agents",
    "crates/agt-git",
    "crates/agt-store",
    "crates/agt-daemon",
    "crates/agt-tui",
    "crates/agt-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
agt-proto = { path = "crates/agt-proto" }
agt-core = { path = "crates/agt-core" }
agt-agents = { path = "crates/agt-agents" }
agt-git = { path = "crates/agt-git" }
agt-store = { path = "crates/agt-store" }
agt-tui = { path = "crates/agt-tui" }

tokio = { version = "1", features = ["full"] }
futures = "0.3"
portable-pty = "0.9"
alacritty_terminal = "0.25"
ratatui = "0.29"
crossterm = { version = "0.29", features = ["event-stream"] }
interprocess = { version = "2", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
toml = "0.8"
directories = "5"
notify = "6"
rusqlite = { version = "0.41", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
notify-rust = "4"
unicode-width = "0.2"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
libc = "0.2"
widestring = "1"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
