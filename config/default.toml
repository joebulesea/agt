# agt 預設設定。使用者設定檔只需要寫要覆蓋的部分。
#   Windows : %APPDATA%\agt\config.toml
#   macOS   : ~/Library/Application Support/agt/config.toml
#   Linux   : $XDG_CONFIG_HOME/agt/config.toml
# repo 專屬設定可以放在 repo 根目錄的 .agt.toml（copy_files / setup / base_branch）。

[general]
prefix_key = "ctrl-a"
sidebar_width = 26
worktree_root = "~/.agt/worktrees"
notify = true                    # 系統通知
idle_shutdown_secs = 600
scrollback_lines = 10000
merge_strategy = "ask"           # ask | merge | squash | rebase
log_output = true                # 終端機紀錄檔
# 分頁中的程式以 OSC 52 寫入剪貼簿時：ask = 先詢問、on = 直接寫入、off = 一律拒絕。
# 沙箱裡的 Agent 也能送出 OSC 52，例如把剪貼簿換成惡意指令，等你貼到終端機。
osc52 = "ask"
# 收尾（merge / pr）時，分頁若改了合併後會自動執行的檔案（.claude/、.agt.toml、CI workflow 等）會先要求確認。
# 這裡可以追加：以 / 結尾 = 整個目錄、含 / = 從 repo 根目錄起算的路徑、其他 = 任何目錄下同名的檔案。
# 例如 ["package.json", "Makefile", "scripts/"]（這些檔案常被主機上的指令執行，但也很常修改，預設不列入）。
sensitive_paths = []

# new_args / resume_args：開新對話／接續對話（R 重新啟動）時接在 args 後面的參數。
# {conversation} = 分頁目前的對話 ID（UUID）；N 重新啟動或接續失敗時會換一個新的。
# 設定了 adapter 的 Agent 沒寫 new_args / resume_args 時沿用 adapter 的值（resume_args = [] 可關閉接續）。
[agents.claude]
command = "claude"
args = []
status_source = "hooks"          # hooks | pattern | none
new_args = ["--session-id", "{conversation}"]
resume_args = ["--resume", "{conversation}"]

[agents.antigravity]
command = "agy"
status_source = "pattern"        # 確認有 hooks 後改成 "hooks"
waiting_patterns = ['\(y/n\)', 'Allow\?']
idle_timeout_secs = 20
resume_args = ["--continue"]     # 接續這個目錄最近一次的對話

# GitHub Copilot CLI（npm install -g @github/copilot）。第一次啟動時在分頁中輸入 /login 登入，
# 或在主機設定環境變數 GH_TOKEN / GITHUB_TOKEN（具備 Copilot Requests 權限的 fine-grained PAT）。
[agents.copilot]
command = "copilot"
status_source = "pattern"
waiting_patterns = ['No, and tell Copilot', 'Do you trust the files']
idle_timeout_secs = 20
# --session-id 開新對話時指定 UUID、接續時找回同一個對話：每個分頁接續自己的對話
# （--continue 接續的是「最近一次」的對話，同時開多個分頁時會接錯）
new_args = ["--session-id", "{conversation}"]
resume_args = ["--session-id", "{conversation}"]

# OpenAI Codex CLI（npm install -g @openai/codex）。第一次啟動時依畫面指示登入，
# 或在主機設定環境變數 OPENAI_API_KEY。
[agents.codex]
command = "codex"
status_source = "pattern"
waiting_patterns = ['Would you like to run the following command', 'Would you like to make the following edits', 'Do you trust the contents of this directory']
idle_timeout_secs = 20
resume_args = ["resume", "--last"]   # 接續這個目錄最近一次的對話

[agents.shell]
command = ""                     # 空字串 = 使用者預設 shell
status_source = "none"
worktree = false

# 在 Docker 容器中執行 Claude Code（沙箱）：容器只看得到這個分頁的 worktree。
# 先建置映像檔：docker build -t agt-claude docker/claude/
# 變數：{cwd} = worktree 路徑，{session} = 分頁 id。
# 容器內無法使用 git（worktree 的 .git 指向主機路徑）；設定 auto_commit 後，收尾時由 agt 在主機上 commit。
# worktree 掛在容器內的 /work/{session}：每個分頁的路徑不同，Agent 的對話記錄（依專案路徑分組）才不會混在一起。
#
# 安全性（三個 *-docker 範例相同）：
#   - --cap-drop / no-new-privileges / --pids-limit：容器內拿不到額外權限，也不能無限產生行程。
#     需要限制資源時自行加上 "--memory=8g", "--cpus=4"（Docker Desktop 的 VM 本身也有上限）。
#   - 網路：容器可以連外網（Agent 要連自己的 API）。Docker 本身無法只允許特定網域；需要網路限制時
#     改用 claude-sbx（Docker Sandboxes 有網路政策，`sbx policy`），或自行在容器外架設 proxy / 防火牆。
#   - agt-*-tools（/opt/agt-tools）放 Agent 執行檔的更新版，Agent 的容器一律唯讀（:ro）；只有 update 指令
#     （daemon 啟動與新建分頁時，在另一個容器執行）把它掛成可寫來更新。分頁裡的 Agent 因此改不到之後所有分頁都會執行的程式。
#   - agt-*-home 是所有分頁共用、可寫的家目錄（登入資料、對話記錄、Agent 的全域設定）。
#     某個分頁的 Agent 若被惡意內容操控，可以改這裡的設定來影響之後的分頁。要完全隔離，把它換成
#     每個分頁各自的 volume "agt-home-{session}:/home/node"，加上
#     on_close = ["docker", "volume", "rm", "-f", "agt-home-{session}"]，並改用環境變數的 token 登入
#     （每個分頁都是全新的家目錄，會重新出現初次設定畫面）。
#   - "-e" 傳進容器的 token 容器內的 Agent 都讀得到，而容器可以連外網：請使用權限最小、
#     可以隨時撤銷的 token（例如只限單一 repo 的 fine-grained PAT），不要傳主機上平常用的那一組。
# [agents.claude-docker]
