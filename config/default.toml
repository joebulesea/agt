# agt 預設設定。使用者設定檔只需要寫要覆蓋的部分。
#   Windows : %APPDATA%\agt\config.toml
#   macOS   : ~/Library/Application Support/agt/config.toml
#   Linux   : $XDG_CONFIG_HOME/agt/config.toml
# repo 專屬設定可以放在 repo 根目錄的 .agt.toml（copy_files / setup / base_branch）。

[general]
prefix_key = "ctrl-a"
sidebar_width = 26
worktree_root = "~/.agt/worktrees"
notify = true                    # 系統通知
idle_shutdown_secs = 600
scrollback_lines = 10000
merge_strategy = "ask"           # ask | merge | squash | rebase
log_output = true                # 終端機紀錄檔

# new_args / resume_args：開新對話／接續對話（R 重新啟動）時接在 args 後面的參數。
# {conversation} = 分頁目前的對話 ID（UUID）；N 重新啟動或接續失敗時會換一個新的。
# 設定了 adapter 的 Agent 沒寫 new_args / resume_args 時沿用 adapter 的值（resume_args = [] 可關閉接續）。
[agents.claude]
command = "claude"
args = []
status_source = "hooks"          # hooks | pattern | none
new_args = ["--session-id", "{conversation}"]
resume_args = ["--resume", "{conversation}"]

[agents.antigravity]
command = "agy"
status_source = "pattern"        # 確認有 hooks 後改成 "hooks"
waiting_patterns = ['\(y/n\)', 'Allow\?']
idle_timeout_secs = 20
resume_args = ["--continue"]     # 接續這個目錄最近一次的對話

# GitHub Copilot CLI（npm install -g @github/copilot）。第一次啟動時在分頁中輸入 /login 登入，
# 或在主機設定環境變數 GH_TOKEN / GITHUB_TOKEN（具備 Copilot Requests 權限的 fine-grained PAT）。
[agents.copilot]
command = "copilot"
status_source = "pattern"
waiting_patterns = ['No, and tell Copilot', 'Do you trust the files']
idle_timeout_secs = 20
resume_args = ["--continue"]     # 接續最近一次的對話

[agents.shell]
command = ""                     # 空字串 = 使用者預設 shell
status_source = "none"
worktree = false

# 在 Docker 容器中執行 Claude Code（沙箱）：容器只看得到這個分頁的 worktree。
# 先建置映像檔：docker build -t agt-claude docker/claude/
# 變數：{cwd} = worktree 路徑，{session} = 分頁 id。
# 容器內無法使用 git（worktree 的 .git 指向主機路徑）；設定 auto_commit 後，收尾時由 agt 在主機上 commit。
# worktree 掛在容器內的 /work/{session}：每個分頁的路徑不同，Agent 的對話記錄（依專案路徑分組）才不會混在一起。
