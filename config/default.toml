# adapter = "claude"               # 沿用 Claude Code 的狀態判斷規則
# status_source = "pattern"        # 容器內無法回報 hooks
# args = ["run", "-it", "--rm", "--init", "--name", "agt-{session}", "--label", "agt=1",
#         "--cap-drop=ALL", "--security-opt=no-new-privileges", "--pids-limit=2048",
#         "-v", "{cwd}:/work/{session}", "-v", "agt-claude-home:/home/node",
#         "-v", "agt-claude-tools:/opt/agt-tools:ro", "-w", "/work/{session}",
#         "-e", "ANTHROPIC_API_KEY", "-e", "CLAUDE_CODE_OAUTH_TOKEN",
#         "agt-claude", "claude", "--dangerously-skip-permissions",
#         "--append-system-prompt", "你在 Docker 沙箱中執行，目前所在的目錄就是專案目錄。容器內無法使用 git，不要執行或修復任何 git 指令；只修改檔案，commit 與合併由外部負責。"]
# new_args = ["--session-id", "{conversation}"]
# resume_args = ["--resume", "{conversation}"]
# cleanup = ["docker", "rm", "-f", "agt-{session}"]   # 關閉分頁時一併移除容器
# auto_commit = true               # 收尾（merge / pr）前自動 commit 容器內做的修改
# # 更新 Claude Code 到最新版（裝進 agt-claude-tools）：agt daemon 啟動時在背景執行，
# # 新建分頁時也會先在分頁中執行一次再啟動 Claude（update_on_new = false 可關閉；R 重新啟動不會執行）
# update = ["docker", "run", "--rm", "-v", "agt-claude-tools:/opt/agt-tools", "agt-claude", "claude", "--version"]

# 在 Docker Sandboxes（sbx，microVM 沙箱）中執行 Claude Code。需要先安裝 sbx 並執行 sbx login，
# 不需要 Docker Desktop。每個分頁一個沙箱，沙箱會保留到分頁關閉（R 重新啟動時沿用，對話記錄與裝過的套件都還在）。
#   args         ：第一次啟動時建立沙箱，掛載 worktree 與主 repo 的 .git（唯讀，沙箱內可用 git status / diff / log）
#   restart_args ：重新啟動時沙箱已存在，不能再指定掛載路徑，只用名稱接回去
#   cleanup      ：Agent 結束、daemon 停止時停止沙箱（釋放記憶體），啟動前也會先執行一次
#   on_close     ：關閉分頁時刪除沙箱
# 變數：{gitdir} = 主 repo 的 .git 目錄（不是 worktree 時，含 {gitdir} 的參數會自動略過）。
