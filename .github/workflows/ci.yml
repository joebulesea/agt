name: CI
on: [push, pull_request]

# 預設的 GITHUB_TOKEN 只能讀：測試不需要寫入 repo
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # action 一律釘在 commit SHA（tag 可以被改指到別的 commit）；註解是對應的版本，由 Dependabot 更新
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: git config --global user.email ci@example.invalid && git config --global user.name ci
      - run: cargo fmt --all -- --check
        if: runner.os == 'Linux'
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # 相依套件的已知弱點（RustSec advisory database）
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-audit
      - run: cargo audit

  # TUI 冒煙測試：在 pty 中執行 agt，用 pyte 模擬終端機並檢查畫面
  tui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - run: git config --global user.email ci@example.invalid && git config --global user.name ci
      - run: cargo build --workspace
      - run: python3 -m pip install pyte
      - run: python3 tests/tui_smoke.py "$PWD/target/debug"

  # 安裝腳本的語法檢查
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh -n scripts/install.sh
      - run: shellcheck scripts/install.sh

  # 授權、重複版本與相依來源（設定在 deny.toml；弱點檢查由上面的 audit 負責）
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny
      - run: cargo deny check bans licenses sources
