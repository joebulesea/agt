name: CI
on: [push, pull_request]

# 預設的 GITHUB_TOKEN 只能讀：測試不需要寫入 repo
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # action 一律釘在 commit SHA（tag 可以被改指到別的 commit）；註解是對應的版本，由 Dependabot 更新
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: clippy
      - run: git config --global user.email ci@example.invalid && git config --global user.name ci
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # 相依套件的已知弱點（RustSec advisory database）
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-audit
      - run: cargo audit
