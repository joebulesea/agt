name: Release
# 推送 v* 標籤時編譯、打包並建立 GitHub Release（附 SHA256SUMS 與安裝腳本）
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            ext: zip
          # 用較舊的 glibc 編譯，舊的 Linux 發行版也能執行
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            ext: tar.gz
    runs-on: ${{ matrix.os }}
    # 只有這個 job 需要寫入 Release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: 標籤必須和 Cargo.toml 的版本一致
        shell: bash
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$ver" != "${GITHUB_REF_NAME}" ]; then
            echo "標籤 ${GITHUB_REF_NAME} 與 Cargo.toml 的版本 v$ver 不一致" >&2
            exit 1
          fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"
      - run: git config --global user.email ci@example.invalid && git config --global user.name ci
      - run: cargo test --workspace --release --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p agt-cli
      - name: 打包
        shell: bash
        run: |
          out="agt-${VERSION}-${{ matrix.platform }}"
          mkdir -p "dist/$out"
          bin="target/${{ matrix.target }}/release"
          if [ "${{ matrix.ext }}" = zip ]; then
            cp "$bin/agt.exe" "dist/$out/"
            (cd "dist/$out" && 7z a -tzip "../$out.zip" agt.exe)
          else
            cp "$bin/agt" "dist/$out/"
            tar -czf "dist/$out.tar.gz" -C "dist/$out" agt
          fi
          echo "ASSET=dist/$out.${{ matrix.ext }}" >> "$GITHUB_ENV"
      - name: 上傳到 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "見 CHANGELOG.md" || true
          gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber

  # 兩個平台都上傳後，產生 SHA256SUMS 並附上安裝腳本
  checksums:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets && cd assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'agt-*'
          sha256sum agt-* > SHA256SUMS
          cat SHA256SUMS
          cp ../scripts/install.sh ../scripts/install.ps1 .
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber SHA256SUMS install.sh install.ps1
