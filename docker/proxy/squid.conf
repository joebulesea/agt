# 只允許 Agent 需要的網域的 squid 設定（容器網路限制範例）。
# 用法見同目錄的 README.md。網域清單依實際使用的 Agent 增減。
http_port 3128

# 只允許 HTTPS 的 CONNECT（不解密內容），其他方法一律拒絕
acl SSL_ports port 443
acl CONNECT method CONNECT

# 允許的網域（開頭的點代表包含子網域）
acl allowed_domains dstdomain .anthropic.com .claude.ai
acl allowed_domains dstdomain .openai.com .chatgpt.com
acl allowed_domains dstdomain .githubcopilot.com .github.com .githubusercontent.com
acl allowed_domains dstdomain .googleapis.com .antigravity.google
# 套件來源（需要時再開）
acl allowed_domains dstdomain .npmjs.org .npmjs.com registry.npmjs.org
acl allowed_domains dstdomain .pypi.org .pythonhosted.org
acl allowed_domains dstdomain .crates.io .rust-lang.org static.crates.io index.crates.io

http_access deny !SSL_ports CONNECT
http_access allow CONNECT allowed_domains
http_access deny all

# 不快取、不洩漏內部資訊
cache deny all
via off
forwarded_for delete
access_log stdio:/dev/stdout
cache_log /dev/null
